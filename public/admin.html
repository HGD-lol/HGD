<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>협곡단 · 관리자</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --rift:#0A1428;--surface:#0F1E38;--surface-2:#132446;--line:#1F3355;--line-soft:#182B4C;
    --ink:#E9EEF7;--ink-2:#AEBDD4;--ink-3:#7A8AA6;--gold:#C8AA6E;--gold-bright:#F0E0B8;--gold-deep:#94743A;
    --blue:#1E9DE3;--red:#E84057;--good:#2ECC8F;--warn:#E0A335;
    --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    --shadow:0 10px 40px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--rift);color:var(--ink);font-family:var(--font);line-height:1.5;letter-spacing:-.01em;
    background-image:radial-gradient(1000px 500px at 20% -10%,rgba(30,157,227,.10),transparent 60%),radial-gradient(1000px 500px at 80% -10%,rgba(232,64,87,.09),transparent 60%);}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--gold-bright)}
  .wrap{max-width:1400px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--rift) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:14px;height:60px}
  .bar b{font-size:17px;font-weight:800}
  .bar small{color:var(--ink-3);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  .spacer{flex:1}
  .btn{appearance:none;border:1px solid var(--line);border-radius:9px;padding:8px 15px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;color:var(--ink-2);background:var(--surface)}
  .btn:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn.primary{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1c1305;border-color:var(--gold-deep)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  main{padding:26px 0 80px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);font-family:inherit;font-size:14px;font-weight:700;padding:12px 16px;cursor:pointer}
  .tab[aria-selected=true]{color:var(--gold-bright);border-bottom-color:var(--gold)}
  .view{display:none}.view.on{display:block}
  input,select,textarea{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px}
  textarea{resize:vertical;min-height:60px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
  label.fld{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--ink-3);font-weight:700}
  .card{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  h2{font-size:18px;margin:0 0 14px}
  h3{font-size:14px;margin:0 0 12px;color:var(--gold-bright)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{text-align:left;color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tr.hidden-row{opacity:.45}
  td input,td select{padding:6px 7px;font-size:12px;width:100%;min-width:0}
  /* 표는 내용 크기대로 두고(칸이 눌려 글자가 잘리지 않게), 좁으면 감싼 쪽이 가로 스크롤 */
  .tw{overflow-x:auto;overscroll-behavior-x:contain}
  .tw table{width:auto;min-width:100%}
  .tw::-webkit-scrollbar{height:10px}
  .tw::-webkit-scrollbar-track{background:transparent}
  .tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  .tw::-webkit-scrollbar-thumb:hover{background:var(--gold-deep)}
  .tw{scrollbar-color:var(--line) transparent;scrollbar-width:thin}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--gold-deep);color:var(--gold-bright);padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .login{max-width:360px;margin:12vh auto 0;text-align:center}
  .login .card{padding:28px}
  .login h1{font-size:22px;margin:0 0 6px}
  .login p{color:var(--ink-3);font-size:13px;margin:0 0 20px}
  .err{color:var(--red);font-size:12.5px;font-weight:600;min-height:16px;margin-top:8px}
  .tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--surface-2)}
  .edit-panel{background:var(--surface-2);border-top:1px solid var(--line);padding:14px 12px}
  .edit-panel .team-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .edit-panel .team-label{font-size:12px;font-weight:800;min-width:50px}
  .edit-panel .team-label.blue{color:var(--blue)}
  .edit-panel .team-label.red{color:var(--red)}
  .edit-panel select.player-sel{padding:5px 6px;font-size:12px;min-width:110px;max-width:140px}
  .edit-panel .edit-actions{display:flex;gap:8px;align-items:center;margin-top:10px}
</style>
</head>
<body>
<header><div class="wrap bar">
  <b>협곡단 관리자</b><small>Admin</small>
  <div class="spacer"></div>
  <a class="btn sm" href="/">← 메인</a>
  <button class="btn sm" id="logoutBtn" style="display:none">로그아웃</button>
</div></header>

<main class="wrap">
  <!-- LOGIN -->
  <section id="loginView" class="login" style="display:none">
    <div class="card">
      <h1>🔧 관리자 로그인</h1>
      <input id="pw" type="password" placeholder="비밀번호" style="width:100%" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn primary" id="loginBtn" style="width:100%;margin-top:10px">로그인</button>
    </div>
  </section>

  <!-- ADMIN -->
  <section id="adminView" style="display:none">
    <div class="tabs">
      <button class="tab" data-t="dashboard" aria-selected="true">대시보드 설정</button>
      <button class="tab" data-t="members" aria-selected="false">단원 관리</button>
      <button class="tab" data-t="matches" aria-selected="false">내전 기록 관리</button>
    </div>

    <div class="view on" id="v-dashboard">
      <div class="card" style="margin-bottom:18px">
        <h3>시즌 관리</h3>
        <p style="color:var(--ink-3);font-size:12px;margin:0 0 12px">새 시즌을 시작하면 내전기록, 전적 순위, 내전 점수가 초기화됩니다. 과거 시즌 기록은 보존됩니다.</p>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <span style="font-size:13px;font-weight:700;color:var(--ink-2)">현재 시즌:</span>
          <span id="currentSeasonName" style="font-size:14px;font-weight:800;color:var(--gold-bright)">로딩 중...</span>
        </div>
        <div id="seasonList" style="margin-bottom:12px"></div>
        <div class="row" style="align-items:flex-end">
          <label class="fld">새 시즌 이름<input id="newSeasonName" placeholder="예: 2026 Split 3" style="width:200px"></label>
          <button class="btn primary" id="addSeasonBtn">새 시즌 시작</button>
        </div>
        <div class="err" id="seasonErr"></div>
      </div>
      <div class="card">
        <h3>대시보드 텍스트 설정</h3>
        <div class="row" style="flex-direction:column;gap:14px;align-items:stretch">
          <label class="fld">제목<input id="dc_title" style="width:100%"></label>
          <label class="fld">설명<textarea id="dc_desc" style="width:100%"></textarea></label>
          <div style="display:flex;align-items:center;gap:12px;margin-top:6px">
            <span style="font-size:13px;font-weight:700;color:var(--ink-2)">내전 등록:</span>
            <button class="btn sm" id="toggleMatchReg">로딩 중...</button>
          </div>
          <div style="text-align:right">
            <button class="btn primary" id="saveDashConfig">저장</button>
          </div>
        </div>
        <div class="err" id="dashErr"></div>
      </div>
      <div class="card" style="margin-top:18px">
        <h3>데이터 백업</h3>
        <p style="color:var(--ink-3);font-size:12px;margin:0 0 12px">Supabase에 저장된 모든 데이터(단원, 내전 기록, 시즌, 설정)를 JSON 파일로 다운로드합니다.</p>
        <button class="btn primary" id="backupBtn">백업 다운로드</button>
      </div>
    </div>

    <div class="view" id="v-members">
      <div class="card" style="margin-bottom:18px">
        <h3>➕ 단원 추가</h3>
        <div class="row">
          <label class="fld">이름<input id="a_name" style="width:120px"></label>
          <label class="fld">출생연도<input id="a_birth" type="number" value="2000" style="width:90px"></label>
          <label class="fld">가입날짜<input id="a_joined" type="date" style="width:140px"></label>
          <label class="fld">닉네임<input id="a_nick" style="width:150px"></label>
          <label class="fld">티어<select id="a_tier"></select></label>
          <label class="fld">주라인<select id="a_main" style="width:110px"></select></label>
          <label class="fld">부라인1<select id="a_sub1" style="width:110px"></select></label>
          <label class="fld">부라인2<select id="a_sub2" style="width:110px"></select></label>
          <label class="fld">직책<select id="a_role"></select></label>
          <button class="btn primary" id="addMemberBtn">추가</button>
        </div>
        <div class="err" id="addErr"></div>
        <p style="color:var(--ink-3);font-size:12px;margin:6px 0 0">주라인 1개, 부라인 최대 2개를 선택하세요.</p>
      </div>
      <div class="card">
        <h3>단원 목록 <span id="memCount" class="tag"></span>
          <button class="btn sm" id="sortNameBtn" style="margin-left:12px;font-size:11px">이름 ▲</button>
        </h3>
        <div class="tw"><table id="memTable"></table></div>
      </div>
    </div>

    <div class="view" id="v-matches">
      <div class="card">
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap">
          <h3 style="margin:0">내전 기록 관리</h3>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;color:var(--ink-3);font-weight:700">시즌:</span>
            <select id="adminSeasonSel" style="padding:5px 10px;font-size:12px"></select>
          </div>
        </div>
        <div class="tw"><table id="matchTable"></table></div>
      </div>
    </div>

  </section>
</main>

<script>
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
async function jget(p){const r=await fetch(p);if(!r.ok)throw Object.assign(new Error(p+' '+r.status),{status:r.status});return r.json();}
async function jsend(m,p,b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.message||p),{payload:j,status:r.status});return j;}
function toast(msg){let t=$("#toast");if(!t){t=document.createElement('div');t.className='toast';t.id='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}

let META={}, MEMBERS=[], LINE_ORDER=[], TIER_ORDER=[];
const ROLES=['단장','부단장','단원','예비'];
const LINE_VALUES=['탑','정글','미드','원딜','서폿','올라이너'];
let memSortDir=1; // 1=오름차순, -1=내림차순

/* ── 인증 ── */
async function checkAuth(){
  const me=await jget('/api/admin/me');
  if(me.authed){ showAdmin(); } else { $("#loginView").style.display='block'; $("#pw").focus(); }
}
function showAdmin(){
  $("#loginView").style.display='none';
  $("#adminView").style.display='block';
  $("#logoutBtn").style.display='inline-flex';
  loadAll();
}
$("#loginBtn").addEventListener("click",login);
$("#pw").addEventListener("keydown",e=>{if(e.key==='Enter')login()});
async function login(){
  const err=$("#loginErr");err.textContent='';
  try{ await jsend('POST','/api/admin/login',{password:$("#pw").value}); showAdmin(); }
  catch(ex){ err.textContent = ex.status===401 ? '비밀번호가 올바르지 않습니다.' : ('오류: '+ex.message); }
}
$("#logoutBtn").addEventListener("click",async()=>{ await jsend('POST','/api/admin/logout'); location.reload(); });

/* ── 탭 ── */
$$(".tab").forEach(t=>t.addEventListener("click",()=>{
  $$(".tab").forEach(x=>x.setAttribute("aria-selected", x===t));
  $$(".view").forEach(v=>v.classList.toggle("on", v.id==="v-"+t.dataset.t));
}));

/* ── 데이터 로드 ── */
function fillSelect(sel,arr,cur){sel.innerHTML=arr.map(v=>`<option value="${v}">${v}</option>`).join('');if(cur!=null)sel.value=cur;}

/* ── 시즌 관리 ── */
async function loadSeasons(){
  try{
    const res=await jget('/api/admin/seasons');
    const seasons=res.seasons||[];
    const current=res.current;
    $("#currentSeasonName").textContent=current?current.name:'없음';
    const listEl=$("#seasonList");
    if(seasons.length<=1){listEl.innerHTML='';return;}
    listEl.innerHTML='<div style="font-size:12px;color:var(--ink-3);margin-bottom:6px">과거 시즌:</div>'+
      seasons.filter(s=>!s.isCurrent).map(s=>
        `<span class="tag" style="margin:2px 4px;font-size:12px">${esc(s.name)}</span>`
      ).join('');
  }catch(ex){console.log('seasons load error',ex)}
}
$("#addSeasonBtn").addEventListener("click",async()=>{
  const err=$("#seasonErr");err.textContent='';
  const name=$("#newSeasonName").value.trim();
  if(!name){err.textContent='시즌 이름을 입력하세요.';return}
  if(!confirm(`'${name}' 시즌을 시작합니다.\n새 시즌이 시작되면 내전기록, 전적 순위, 내전 점수가 새로 시작됩니다.\n계속할까요?`))return;
  try{
    await jsend('POST','/api/admin/seasons',{name});
    toast('새 시즌이 시작되었습니다: '+name);
    $("#newSeasonName").value='';
    await loadSeasons();
    await loadDashConfig();
  }catch(ex){err.textContent='실패: '+(ex.payload&&ex.payload.messages&&ex.payload.messages[0]||ex.message);}
});

/* ── 대시보드 설정 ── */
let matchRegEnabled=true;
async function loadDashConfig(){
  try{
    const cfg=await jget('/api/admin/dashboard-config');
    $("#dc_title").value=cfg.title||'';
    $("#dc_desc").value=cfg.description||'';
    matchRegEnabled=cfg.matchRegistrationEnabled!==false;
    updateMatchRegBtn();
  }catch(ex){console.log('dash config load error',ex)}
}
function updateMatchRegBtn(){
  const btn=$("#toggleMatchReg");
  if(matchRegEnabled){btn.textContent='활성화됨 (클릭하여 비활성화)';btn.style.borderColor='var(--good)';btn.style.color='var(--good)';}
  else{btn.textContent='비활성화됨 (클릭하여 활성화)';btn.style.borderColor='var(--red)';btn.style.color='var(--red)';}
}
$("#toggleMatchReg").addEventListener("click",async()=>{
  matchRegEnabled=!matchRegEnabled;
  try{
    await jsend('PATCH','/api/admin/dashboard-config',{matchRegistrationEnabled:matchRegEnabled});
    updateMatchRegBtn();
    toast(matchRegEnabled?'내전 등록이 활성화되었습니다':'내전 등록이 비활성화되었습니다');
  }catch(ex){matchRegEnabled=!matchRegEnabled;toast('실패: '+ex.message);}
});
$("#saveDashConfig").addEventListener("click",async()=>{
  const err=$("#dashErr");err.textContent='';
  try{
    await jsend('PATCH','/api/admin/dashboard-config',{
      title:$("#dc_title").value,
      description:$("#dc_desc").value,
    });
    toast('대시보드 설정이 저장되었습니다');
  }catch(ex){err.textContent='저장 실패: '+ex.message;}
});

/* ── 단원 관리 ── */
async function loadMembers(){
  const {members}=await jget('/api/members?includeHidden=1');
  MEMBERS=members;
  members.sort((a,b)=>a.name.localeCompare(b.name,'ko')*memSortDir);
  $("#memCount").textContent=members.length+'명';
  const tierOpts=t=>TIER_ORDER.map(x=>`<option ${x===t?'selected':''}>${x}</option>`).join('');
  const roleOpts=r=>ROLES.map(x=>`<option ${x===r?'selected':''}>${x}</option>`).join('');
  const lineSel=(cur)=>['없음',...LINE_VALUES].map(l=>`<option value="${l}" ${l===cur?'selected':''}>${l}</option>`).join('');
  $("#memTable").innerHTML=`<thead><tr>
    <th>이름</th><th>출생</th><th>가입날짜</th><th>닉네임</th><th>티어</th><th>주라인</th><th>부라인1</th><th>부라인2</th><th>직책</th><th>점수</th><th></th></tr></thead>
    <tbody>${members.map(m=>{
      const mainVal=(m.main&&m.main[0])||'없음';
      const sub1Val=(m.sub&&m.sub[0])||'없음';
      const sub2Val=(m.sub&&m.sub[1])||'없음';
      return `<tr data-id="${m.id}" class="${m.hidden?'hidden-row':''}">
      <td><input data-f="name" value="${esc(m.name)}" style="width:104px"></td>
      <td><input data-f="birth" type="number" value="${m.birth}" style="width:70px"></td>
      <td><input data-f="joined" type="date" value="${esc(m.joined||'')}" style="width:140px"></td>
      <td><input data-f="nick" value="${esc(m.nick)}" style="width:130px"></td>
      <td><select data-f="tier" style="width:118px">${tierOpts(m.tier)}</select></td>
      <td><select data-f="main" style="width:96px">${lineSel(mainVal)}</select></td>
      <td><select data-f="sub1" style="width:96px">${lineSel(sub1Val)}</select></td>
      <td><select data-f="sub2" style="width:96px">${lineSel(sub2Val)}</select></td>
      <td><select data-f="role" style="width:92px">${roleOpts(m.role)}</select></td>
      <td class="num"><span class="tag">${m.score}</span></td>
      <td style="white-space:nowrap">
        <button class="btn sm save">저장</button>
        ${m.hidden?'<button class="btn sm restore">복원</button> <button class="btn sm danger perm-del">완전삭제</button>':'<button class="btn sm danger del">삭제</button>'}
      </td></tr>`;}).join('')}</tbody>`;
}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;')}
// <input type="date"> 는 로컬 날짜를 쓰므로 toISOString(UTC) 이 아니라 로컬로 만든다
function todayLocal(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function resetJoinedInput(){ $("#a_joined").value=todayLocal(); }
$("#memTable").addEventListener("click",async e=>{
  const tr=e.target.closest("tr"); if(!tr)return; const id=tr.dataset.id;
  if(e.target.classList.contains("save")){
    const patch={};
    $$("[data-f]",tr).forEach(inp=>{
      const f=inp.dataset.f;
      if(f==='main'){
        const v=inp.value;
        patch.main=v&&v!=='없음'?[v]:[];
      } else if(f==='sub1'||f==='sub2'){
        // handled below
      } else {
        patch[f]=inp.value;
      }
    });
    const s1=$('[data-f="sub1"]',tr).value;
    const s2=$('[data-f="sub2"]',tr).value;
    patch.sub=[s1,s2].filter(v=>v&&v!=='없음');
    try{ await jsend('PATCH','/api/admin/members/'+id,patch); toast('저장했습니다'); await refreshAll(); }
    catch(ex){ toast((ex.payload&&ex.payload.messages&&ex.payload.messages[0])||'저장 실패'); }
  } else if(e.target.classList.contains("del")){
    if(!confirm('이 단원을 명단에서 숨기시겠어요? (과거 기록은 유지됩니다)'))return;
    try{ await jsend('DELETE','/api/admin/members/'+id); toast('삭제(숨김)했습니다'); await refreshAll(); }catch(ex){toast('실패: '+ex.message);}
  } else if(e.target.classList.contains("perm-del")){
    if(!confirm('이 단원을 완전히 삭제합니다. 과거 기록에서도 이름이 표시되지 않습니다. 정말 삭제할까요?'))return;
    try{ await jsend('DELETE','/api/admin/members/'+id+'/permanent'); toast('완전 삭제했습니다'); await refreshAll(); }catch(ex){toast('실패: '+ex.message);}
  } else if(e.target.classList.contains("restore")){
    try{ await jsend('POST','/api/admin/members/'+id+'/restore'); toast('복원했습니다'); await refreshAll(); }catch(ex){toast('실패: '+ex.message);}
  }
});
$("#sortNameBtn").addEventListener("click",()=>{
  memSortDir*=-1;
  $("#sortNameBtn").textContent='이름 '+(memSortDir>0?'▲':'▼');
  loadMembers();
});
$("#addMemberBtn").addEventListener("click",async()=>{
  const err=$("#addErr");err.textContent='';
  const body={
    name:$("#a_name").value.trim(), birth:Number($("#a_birth").value),
    joined:$("#a_joined").value||todayLocal(),
    nick:$("#a_nick").value.trim(), tier:$("#a_tier").value,
    main:$("#a_main").value&&$("#a_main").value!=='없음'?[$("#a_main").value]:[],
    sub:[$("#a_sub1").value,$("#a_sub2").value].filter(Boolean).filter(v=>v!=='없음'),
    role:$("#a_role").value,
  };
  try{ await jsend('POST','/api/admin/members',body); toast('단원을 추가했습니다');
    $("#a_name").value='';$("#a_nick").value='';$("#a_main").value='없음';$("#a_sub1").value='없음';$("#a_sub2").value='없음';
    resetJoinedInput();
    await refreshAll();
  }catch(ex){ err.textContent=(ex.payload&&ex.payload.messages&&ex.payload.messages[0])||('추가 실패: '+ex.message); }
});
async function refreshAll(){ await loadMembers(); await loadMatches(); }

/* ── 내전 관리 ── */
let MATCHES=[], SEASONS=[], adminCurrentSeason=null, adminSeasonFilter=null;
function memberOpts(selId){
  return MEMBERS.filter(m=>!m.hidden).map(m=>
    `<option value="${m.id}" ${m.id===selId?'selected':''}>${m.name} (${m.tier})</option>`
  ).join('');
}
function populateAdminSeasonSel(){
  const sel=$("#adminSeasonSel");if(!sel)return;
  sel.innerHTML=SEASONS.map(s=>
    `<option value="${s.id}" ${s.isCurrent?'selected':''}>${s.name}${s.isCurrent?' (현재)':''}</option>`
  ).join('');
}
async function loadMatches(){
  const sid=adminSeasonFilter||((adminCurrentSeason&&adminCurrentSeason.id)||'');
  const url=sid?'/api/matches?season='+encodeURIComponent(sid):'/api/matches';
  const {matches}=await jget(url);
  MATCHES=matches;
  $("#matchTable").innerHTML=`<thead><tr><th>날짜</th><th>모드</th><th>결과</th><th>블루팀</th><th>레드팀</th><th></th></tr></thead>
    <tbody>${matches.map(mt=>{
      return `<tr data-id="${mt.id}">
        <td class="num">${mt.date.slice(0,10)}</td>
        <td><span class="tag">${mt.mode||'협곡'}</span></td>
        <td><b style="color:${mt.blueWin?'var(--blue)':'var(--red)'}">${mt.blueWin?'블루 승':'레드 승'}</b></td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${mt.blue.map(p=>p.name).join(', ')}</td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${mt.red.map(p=>p.name).join(', ')}</td>
        <td style="white-space:nowrap">
          <button class="btn sm edit-match">수정</button>
          <button class="btn sm danger del">삭제</button>
        </td>
      </tr>`;}).join('')}</tbody>`;
}
$("#matchTable").addEventListener("click",async e=>{
  const tr=e.target.closest("tr"); if(!tr)return; const id=tr.dataset.id;
  if(e.target.classList.contains("edit-match")){
    // 이미 열린 편집 패널 닫기
    const existing=tr.nextElementSibling;
    if(existing&&existing.classList.contains('edit-row')){existing.remove();return}
    $$(".edit-row",$("#matchTable")).forEach(r=>r.remove());
    const mt=MATCHES.find(m=>m.id===id); if(!mt)return;
    const editTr=document.createElement('tr');
    editTr.className='edit-row';
    editTr.innerHTML=`<td colspan="6"><div class="edit-panel">
      <div class="team-row">
        <span class="team-label blue">블루팀</span>
        ${mt.blue.map((p,i)=>`<select class="player-sel" data-team="blue" data-idx="${i}">${memberOpts(p.id)}</select>`).join('')}
      </div>
      <div class="team-row">
        <span class="team-label red">레드팀</span>
        ${mt.red.map((p,i)=>`<select class="player-sel" data-team="red" data-idx="${i}">${memberOpts(p.id)}</select>`).join('')}
      </div>
      <div class="edit-actions">
        <span style="font-size:12px;font-weight:700;color:var(--ink-3)">승리팀:</span>
        <select class="edit-winner" style="padding:5px 8px;font-size:12px">
          <option value="blue" ${mt.blueWin?'selected':''}>블루 승</option>
          <option value="red" ${!mt.blueWin?'selected':''}>레드 승</option>
        </select>
        <span style="flex:1"></span>
        <button class="btn sm cancel-edit">취소</button>
        <button class="btn sm primary save-edit">저장</button>
      </div>
    </div></td>`;
    tr.after(editTr);
    // 취소
    $(".cancel-edit",editTr).addEventListener("click",()=>editTr.remove());
    // 저장
    $(".save-edit",editTr).addEventListener("click",async()=>{
      const blue=$$("[data-team=blue]",editTr).map(s=>({id:+s.value}));
      const red=$$("[data-team=red]",editTr).map(s=>({id:+s.value}));
      const winner=$(".edit-winner",editTr).value;
      const allIds=[...blue,...red].map(p=>p.id);
      const dup=allIds.find((v,i)=>allIds.indexOf(v)!==i);
      if(dup!=null){toast('같은 선수가 중복 선택되었습니다.');return}
      try{
        await jsend('PUT','/api/matches/'+id,{date:mt.date,winner,mode:mt.mode||'협곡',blue,red});
        toast('수정했습니다');
        await refreshAll();
      }catch(ex){toast('수정 실패: '+(ex.payload&&ex.payload.messages&&ex.payload.messages[0]||ex.message));}
    });
  } else if(e.target.classList.contains("del")){
    if(!confirm('이 내전 기록을 삭제할까요?'))return;
    try{ await jsend('DELETE','/api/matches/'+id); toast('삭제했습니다'); await loadMatches(); }catch(ex){toast('실패: '+ex.message);}
  }
});

$("#adminSeasonSel").addEventListener("change",e=>{
  adminSeasonFilter=e.target.value;
  loadMatches();
});

async function loadAll(){
  META=await jget('/api/meta');
  LINE_ORDER=META.lineOrder; TIER_ORDER=META.tierOrder;
  fillSelect($("#a_tier"),TIER_ORDER); $("#a_tier").value='언랭';
  fillSelect($("#a_role"),ROLES); $("#a_role").value='예비';
  fillSelect($("#a_main"),['없음',...LINE_VALUES]); $("#a_main").value='없음';
  fillSelect($("#a_sub1"),['없음',...LINE_VALUES]); $("#a_sub1").value='없음';
  fillSelect($("#a_sub2"),['없음',...LINE_VALUES]); $("#a_sub2").value='없음';
  resetJoinedInput();                      // 신규 단원 가입날짜 기본값 = 오늘
  await loadDashConfig();
  await loadSeasons();
  // 시즌 목록 가져오기
  try{
    const sRes=await jget('/api/seasons');
    SEASONS=sRes.seasons||[];
    adminCurrentSeason=sRes.current;
    populateAdminSeasonSel();
  }catch(ex){console.log('seasons load error',ex)}
  await loadMembers(); await loadMatches();
}

/* ── 데이터 백업 ── */
$("#backupBtn").addEventListener("click",async()=>{
  try{
    const r=await fetch('/api/admin/backup');
    if(!r.ok) throw new Error('백업 실패: '+r.status);
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=r.headers.get('content-disposition')?.match(/filename="(.+)"/)?.[1]||'hgd-backup.json';
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    toast('백업 파일이 다운로드되었습니다');
  }catch(ex){toast('백업 실패: '+ex.message);}
});

checkAuth().catch(ex=>{ $("#loginView").style.display='block'; console.error(ex); });
</script>
